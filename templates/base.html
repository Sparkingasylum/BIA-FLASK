<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ siteName }}: {{ title }}</title>

    <!-- Bootstrap 5 CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
     <!-- the nav class is used to create a navigation bar and the color for the background -->
    <nav class="navbar navbar-expand-lg navbar-light bg-warning border-bottom border-2 border-dark">
        <div class="container-fluid">
            <!-- the a class text-warning and fw-bold is used to style the brand link in color and font weight -->
           <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
    <span class="text-white">BIA</span> <span class="text-danger">Opportunities</span>
</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link active" aria-current="page" href="/">Home</a>
                    <a class="nav-link" href="/about">About</a>
                    <a class="nav-link" href="/contact">Contact</a>
                    </div>
                <!-- Search and filter options in the navigation bar at the website homepage -->
            <form method="get" action="{{ url_for('index') }}" class="d-flex gap-2 my-2 my-lg-0 mx-lg-3" role="search">
                <label for="q" class="visually-hidden">Search</label>
                <input name="q" id="q" type="search" class="form-control" placeholder="Search for anything...." value="{{ request.args.get('q', '') }}">

                <label for="job_type" class="visually-hidden">Filter</label>
                <select name="job_type" id="job_type" class="form-select">
                    <option value="">All types</option>
                    <option value="Placement" {% if request.args.get('job_type') == 'Placement' %}selected{% endif %}>Placement</option>
                    <option value="Graduate" {% if request.args.get('job_type') == 'Graduate' %}selected{% endif %}>Graduate</option>
                </select>

                <button type="submit" class="btn btn-dark">Search</button>
            </form>


            <!-- Right hand side navigation bar-->
             <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/login">Login</a>
                <a class="nav-link" href="/register">Register</a>
            </div>
        </div>
    </nav>

    <!--  2 Column Layout  -->
    <div class="container mt-2">
        <div class="row">

            <!-- Column 1: Main Content -->
            <div id="main-content" class="col-12">

                {% block content %}
                <!-- This is where the content from child templates will be inserted -->
                {% endblock %}

            </div>


                {% block sidebarContent %}
                <!-- This is where any sidebar content from child templates will be inserted -->
                {% endblock %}
            </div>

        </div>
    </div>
    <footer class="text-center mt-4">
        <p>&copy; 2027 {{ siteName }}. All rights reserved.</p>
    </footer>

</body>

</html>
